name: Temporary verified synthetic endurance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temporary-endurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify successful combined run and reviewed target pins
        id: upstream
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verification/cohort11-endurance/remote.py verify-upstream
      - name: Download only the verified combined artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.upstream.outputs.artifact_id }}
          path: ${{ runner.temp }}/cohort11-endurance/incoming
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: LimePencil/jev-observer
          run-id: ${{ steps.upstream.outputs.run_id }}
          digest-mismatch: error
      - name: Run concurrent bounded synthetic continuation workloads
        timeout-minutes: 114
        run: python3 scripts/verification/cohort11-endurance/remote.py run
      - name: Collect only bounded diagnostic reports
        if: always()
        timeout-minutes: 2
        run: python3 scripts/verification/cohort11-endurance/remote.py collect
      - name: Preserve synthetic endurance diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-endurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cohort11-endurance-reports/
          if-no-files-found: error
          retention-days: 7
