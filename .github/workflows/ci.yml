name: Build and verify

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            fixtures/sdk/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fixtures/sdk/python-requirements.txt
      - name: Check release metadata
        run: |
          python3 scripts/check-release.py
          python3 scripts/test-release-metadata.py
      - name: Install pinned Rust checks
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
          rustc --version
      - name: Restore Rust dependencies and build outputs
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keep dependency builds across source changes; Cargo still checks every build.
          key: verify-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            verify-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
            verify-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-
      - name: Verify locked dependency notices
        run: python3 scripts/generate-license-notices.py --check
      - name: Build dashboard before embedding
        run: |
          npm ci --prefix ui --no-audit --no-fund
          npm run build --prefix ui
      - name: Verify decision capture converters
        run: python3 scripts/test-decision-capture.py
      - name: Verify retention soak failure diagnostics
        run: python3 scripts/test-retention-soak.py
      - name: Verify stress helper discovery without building or loading a server
        run: node --test scripts/test-stress-cargo.mjs
      - name: Verify isolated keyring fixture failure diagnostics
        run: python3 scripts/test-linux-keyring-harness.py
      - name: Verify shell installation and failed-upgrade handling
        run: python3 scripts/test-install.py
      - name: Verify current and legacy workspace-token fixture selection
        run: python3 scripts/test-token-layouts.py
      - name: Check Rust formatting, lints and tests
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build bundled executable
        run: cargo build --release --locked
      - name: Configure reliable Ubuntu dependency downloads
        run: bash scripts/configure-ci-apt.sh
      - name: Verify Linux credential-store upgrade and rollback
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus gnome-keyring
          python3 scripts/download-release-baseline.py --version 0.3.0 --target x86_64-unknown-linux-musl --output-dir "$RUNNER_TEMP/keyring-baseline"
          python3 scripts/test-linux-keyring.py --baseline "$RUNNER_TEMP/keyring-baseline/jev-observer" --candidate target/release/jev-observer --output "$RUNNER_TEMP/keyring-compatibility.json"
      - name: Run browser interaction and accessibility checks
        timeout-minutes: 12
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Exercise the packaged backend in the browser
        env:
          OBSERVER_BINARY: ${{ github.workspace }}/target/release/jev-observer
        run: npm run test:integration --prefix ui
      - name: Verify authenticated dashboard monitor
        run: node scripts/test-watch-dashboard.mjs
      - name: Install pinned SDK fixtures
        run: |
          python -m venv "$RUNNER_TEMP/observer-sdk-python"
          "$RUNNER_TEMP/observer-sdk-python/bin/python" -m pip install -r fixtures/sdk/python-requirements.txt
          npm ci --prefix fixtures/sdk --ignore-scripts --no-audit --no-fund
      - name: Verify real SDKs against loopback mock only
        run: |
          "$RUNNER_TEMP/observer-sdk-python/bin/python" scripts/sdk-compatibility.py \
            --binary target/release/jev-observer \
            --node-sdk "$GITHUB_WORKSPACE/fixtures/sdk/node_modules/@typesafe-ai/sdk" \
            --output "$RUNNER_TEMP/sdk-compatibility.json"
      - name: Retain SDK results and browser failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-verification
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/sdk-compatibility.json
            ${{ runner.temp }}/keyring-compatibility.json
            ui/test-results/
            ui/test-results-integration/
      - name: Prepare verified integration executables and provenance
        if: success() && github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: |
          cargo build --release --locked --example upgrade_probe
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, shutil, subprocess, sys
          root = pathlib.Path.cwd()
          base = "1a8a4f6c143c8eee779259df9401ab39ec78192d"
          expected = "1c444d00b24555f1fd5479bf9f1e792ab0daa5520d93fd0e2f6a3e1bbda19150"
          def command(*argv):
              return subprocess.check_output(argv, text=True).strip()
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          head = command("git", "rev-parse", "HEAD")
          assert head == os.environ["GITHUB_SHA"]
          parents = [line.split()[1] for line in command("git", "cat-file", "-p", "HEAD").splitlines() if line.startswith("parent ")]
          assert parents == [base], "verification commit must be the sole child of frozen source"
          assert not command("git", "status", "--porcelain", "--untracked-files=no"), "tracked source changed during CI"
          files = []
          for line in command("git", "ls-tree", "-r", "HEAD").splitlines():
              metadata, name = line.split("\t")
              mode, kind, oid = metadata.split()
              path = root / name
              assert kind == "blob" and mode in ("100644", "100755") and path.is_file() and not path.is_symlink()
              files.append({"path": name, "git_mode": mode, "bytes": path.stat().st_size, "sha256": digest(path)})
          files.sort(key=lambda item: item["path"])
          production = [entry for entry in files if entry["path"] != ".github/workflows/ci.yml"]
          actual = hashlib.sha256(json.dumps(production, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          assert actual == expected, "production source differs from frozen integration"
          dist = []
          for path in sorted((root / "ui/dist").rglob("*")):
              assert not path.is_symlink()
              if path.is_file():
                  dist.append({"path": str(path.relative_to(root)), "bytes": path.stat().st_size, "sha256": digest(path)})
          assert dist and len(dist) <= 64 and sum(item["bytes"] for item in dist) <= 16777216
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cohort12-main-verified"
          out.mkdir(mode=0o700)
          binaries = {}
          for source, name in [("target/release/jev-observer", "observer-integration-cohort12-main"), ("target/release/examples/upgrade_probe", "upgrade-probe-cohort12-main")]:
              path = root / source
              assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 67108864
              destination = out / name
              shutil.copyfile(path, destination)
              assert digest(destination) == digest(path)
              binaries[name] = {"source": source, "bytes": destination.stat().st_size, "sha256": digest(destination)}
          report = {"schema": 1, "source_commit": base, "verification_commit": head,
                    "production_manifest_sha256": actual, "excluded_only": ".github/workflows/ci.yml",
                    "tracked_source": files, "embedded_ui": dist, "binaries": binaries,
                    "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "repository": os.environ["GITHUB_REPOSITORY"], "runner_os": os.environ["RUNNER_OS"], "runner_arch": os.environ["RUNNER_ARCH"],
                    "platform": {"system": platform.system(), "machine": platform.machine(), "libc": platform.libc_ver()},
                    "toolchains": {"rustc": command("rustc", "-Vv"), "cargo": command("cargo", "--version"), "node": command("node", "--version"), "npm": command("npm", "--version"), "python": sys.version},
                    "scope": "Generated only after all preceding combined CI checks succeeded. Successful workflow conclusion and exact artifact hashes must be verified separately before use."}
          (out / "provenance.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Retain verified integration executables
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cohort12-main-verified-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: ${{ runner.temp }}/cohort12-main-verified/
      - name: Save Rust dependencies and build outputs
        if: success() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
