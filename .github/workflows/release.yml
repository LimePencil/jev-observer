name: Package and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      latest: ${{ steps.metadata.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions, tag and release notes
        id: metadata
        run: python3 scripts/check-release.py --github-output "$GITHUB_OUTPUT"
      - name: Check release metadata regressions
        run: python3 scripts/test-release-metadata.py

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            fixtures/sdk/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify shell installer
        if: runner.os != 'Windows'
        run: python scripts/test-install.py
      - name: Install native musl compiler
        if: runner.os == 'Linux'
        run: |
          bash scripts/configure-ci-apt.sh
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Configure Windows native crypto build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) {
            $perl = (Get-Command perl.exe -All | Where-Object { $_.Source -notmatch '\\Git\\' } | Select-Object -First 1).Source
          }
          if (-not $perl) { throw 'A native Windows Perl is required to build bundled OpenSSL.' }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $nasm = 'C:\Program Files\NASM'
          if (Test-Path $nasm) { $nasm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Install Rust checks and target
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
          rustc --version
          rustup target add "$RELEASE_TARGET"
      - name: Restore native Rust dependencies and build outputs
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-
            native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-
      - name: Verify locked dependency notices
        run: python scripts/generate-license-notices.py --check
      - name: Build embedded dashboard
        run: |
          npm ci --prefix ui --no-audit --no-fund
          npm run build --prefix ui
      - name: Check, test and build native executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            export CC=musl-gcc
            linker_target=$(printf '%s' "$RELEASE_TARGET" | tr '[:lower:]-' '[:upper:]_')
            export "CARGO_TARGET_${linker_target}_LINKER=musl-gcc"
          fi
          cargo fmt --all --check
          cargo clippy --locked --all-targets --target "$RELEASE_TARGET" -- -D warnings
          cargo test --locked --target "$RELEASE_TARGET"
          cargo build --release --locked --target "$RELEASE_TARGET"
          cargo build --release --locked --target "$RELEASE_TARGET" --example upgrade_probe
      - name: Run browser interaction and accessibility checks
        timeout-minutes: 12
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Exercise the packaged backend in the browser
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=".exe"; fi
          export OBSERVER_BINARY="$GITHUB_WORKSPACE/target/$RELEASE_TARGET/release/jev-observer$suffix"
          npm run test:integration --prefix ui
      - name: Verify upgrade from published 0.1.0
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=".exe"; fi
          python scripts/download-release-baseline.py --target "$RELEASE_TARGET" --output-dir "$RUNNER_TEMP/observer-baseline"
          python scripts/test-upgrade.py \
            --baseline "$RUNNER_TEMP/observer-baseline/jev-observer$suffix" \
            --candidate "target/$RELEASE_TARGET/release/jev-observer$suffix" \
            --probe "target/$RELEASE_TARGET/release/examples/upgrade_probe$suffix" \
            --output upgrade-validation.json
      - name: Verify pinned SDKs against loopback mock
        shell: bash
        run: |
          python -m pip install -r fixtures/sdk/python-requirements.txt
          npm ci --prefix fixtures/sdk --ignore-scripts --no-audit --no-fund
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=".exe"; fi
          python scripts/sdk-compatibility.py \
            --binary "target/$RELEASE_TARGET/release/jev-observer$suffix" \
            --node-sdk "$GITHUB_WORKSPACE/fixtures/sdk/node_modules/@typesafe-ai/sdk" \
            --output sdk-compatibility.json
      - name: Check live startup, demo and embedded UI, then package
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=".exe"; fi
          python scripts/package-release.py \
            --binary "target/$RELEASE_TARGET/release/jev-observer$suffix" \
            --target "$RELEASE_TARGET" --version "$RELEASE_TAG" \
            --output-dir release-assets
      - name: Verify Windows installation and failed upgrades
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test-install-windows.py --assets release-assets
      - name: Retain verified native archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
      - name: Retain native validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            sdk-compatibility.json
            upgrade-validation.json
            ui/test-results/
            ui/test-results-integration/
      - name: Save native Rust dependencies and build outputs
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  aggregate:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-artifacts
      - name: Verify all six archives and aggregate checksums
        run: python3 scripts/verify-release-assets.py
      - name: Retain verified complete release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-assets
          if-no-files-found: error
          retention-days: 14
          path: release-assets/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [preflight, aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      RELEASE_LATEST: ${{ needs.preflight.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets
          path: release-assets
      - name: Stage assets in a draft release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          if not json.loads(Path("release-state.json").read_text())["isDraft"]:
              raise SystemExit("Refusing to change an already published release")
          PY
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$RELEASE_PRERELEASE" \
              --title "Jev Observer $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
          fi
          gh release edit "$RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md" --prerelease="$RELEASE_PRERELEASE"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Confirm complete asset set and publish
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("release-state.json").read_text())
          expected = {path.name: path.stat().st_size for path in Path("release-assets").iterdir()}
          actual = {asset["name"]: asset["size"] for asset in release["assets"]}
          if not release["isDraft"] or len(expected) != 7 or actual != expected:
              raise SystemExit("Release must remain a draft until all seven assets are uploaded intact")
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$RELEASE_PRERELEASE" --latest="$RELEASE_LATEST"
